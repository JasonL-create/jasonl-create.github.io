async function vcImportReview(file){

  for(const c of incoming){if(db.contacts.some(e=>vcDuplicate(c,e)))dupes.push(c);
   else if(unique.some(e=>vcDuplicate(c,e)))within.push(c);else unique.push(c)}

  if(!unique.length){flash('All contacts are already imported');return}
  if(!confirm(summary))return;

function dateEntries(){

 for(const c of db.contacts){if(c.archived)continue;
  const entries=[];
  if(c.birthday)entries.push({kind:'Birthday',date:c.birthday});
  for(const d of c.specialDates||[])if(d.date)entries.push({kind:d.type||'Special date',date:d.date});
  for(const d of entries){const raw=String(d.date),m=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)||raw.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?$/);
   if(!m)continue;
   let month,day,year;
   if(raw.includes('-')){year=Number(m[1]);month=Number(m[2]);day=Number(m[3])}else{month=Number(m[1]);day=Number(m[2]);year=m[3]?Number(m[3]):null}
   if(month<1||month>12||day<1||day>31)continue;
   let next=new Date(y,month-1,day,12);const today=new Date(y,now.getMonth(),now.getDate(),12);if(next<today)next=new Date(y+1,month-1,day,12);
   const days=Math.round((next-today)/86400000);if(days>60)continue;

   items.push({id:c.id,name:c.name,kind:d.kind+anniversary,date:next,days});
  }

}

 if(mode==='start'){area.innerHTML=`<div class="cloud-card cloud-intro"><div class="cloud-hero">☁</div><h2>Keep your contacts in sync</h2><p class="hint">Securely back up your contacts and keep them updated across your devices.</p><button class="action full" id="cloud-choose-create">Create an Account</button><button class="cloud-outline" id="cloud-choose-signin">I Already Have an Account</button></div>`;$('#cloud-choose-create').onclick=()=>cloudAuthScreen('create');$('#cloud-choose-signin').onclick=()=>cloudAuthScreen('signin');return}
 if(mode==='verify'){area.innerHTML=`<div class="cloud-card"><h2>Check your email</h2><p>We've sent a confirmation email if your account requires verification. Open the link in your inbox, then come back to sign in.</p><button class="action full" id="cloud-to-signin">Continue to Sign In</button></div>`;$('#cloud-to-signin').onclick=()=>cloudAuthScreen('signin');return}
 let create=mode==='create',reset=mode==='reset';area.innerHTML=`<button class="back" id="cloud-auth-back">${svg('back')} Back</button><div class="cloud-card"><h2>${reset?'Reset Password':create?'Create Account':'Sign In'}</h2><p class="hint">${reset?'Enter your account email to receive a password reset link.':create?'Enter your email and choose a <strong>new password</strong> for your Contacts account.':'Use the email and password you previously created.'}</p><form id="cloud-auth-form"><label class="cloud-label" for="cloud-email">Email address</label><input class="field" id="cloud-email" type="email" autocomplete="email" placeholder="you@example.com" required>${reset?'':`<label class="cloud-label" for="cloud-password">${create?'Create a password':'Password'}</label><input class="field" id="cloud-password" type="password" autocomplete="${create?'new-password':'current-password'}" minlength="6" placeholder="${create?'Choose a new password':'Enter your existing password'}" required>${create?'<label class="cloud-label" for="cloud-confirm">Confirm password</label><input class="field" id="cloud-confirm" type="password" autocomplete="new-password" minlength="6" placeholder="Re-enter your new password" required>':''}`}<button class="action full cloud-primary" type="submit" id="cloud-auth-submit">${reset?'Send Reset Link':create?'Create Account':'Sign In'}</button></form>${!create&&!reset?'<button class="ghost full" id="cloud-forgot">Forgot password?</button>':''}</div>`;
 $('#cloud-auth-back').onclick=()=>cloudAuthScreen(reset?'signin':'start');$('#cloud-forgot')?.addEventListener('click',()=>cloudAuthScreen('reset'));$('#cloud-auth-form').onsubmit=e=>{e.preventDefault();cloudAuth(mode)};
}
function cloudAdvanced(client,hasCloud){let panel=$('#cloud-advanced');if(!panel)return;panel.innerHTML=`<p class="hint">These tools are optional. Keep a separate JSON export before replacing data.</p><button class="cloud-outline" id="cloud-upload">Back Up This Device to Cloud</button><button class="cloud-outline" id="cloud-restore" ${hasCloud?'':'disabled'}>Restore Cloud Backup to This Device</button><button class="cloud-outline" id="cloud-export">Download Local JSON Backup</button>`;$('#cloud-upload').onclick=cloudUpload;$('#cloud-restore').onclick=cloudRestore;$('#cloud-export').onclick=()=>vcDownload(JSON.stringify(db,null,2),'contacts-backup.json','application/json');}
async function cloudRefresh(){let area=$('#cloud-account');if(!area)return;try{
 let client=cloudApi(),{data:{user},error}=await client.auth.getUser();if(error&&error.name!=='AuthSessionMissingError')throw error;if(!$('#cloud-account'))return;
 if(!user){cloudAuthScreen(cloudAuthMode);return}
 let {data,error:readError}=await client.from('contact_backups').select('updated_at,backup_data').eq('user_id',user.id).maybeSingle();if(readError)throw readError;
 let cloudCount=Array.isArray(data?.backup_data?.contacts)?data.backup_data.contacts.length:0,hasCloud=!!data&&Array.isArray(data.backup_data?.contacts),same=hasCloud&&stableCloudJSON(data.backup_data)===stableCloudJSON(db),active=syncEnabled();
 let heading='',desc='',cta='',action='';
 if(active){heading=syncBlocked?'Sync needs attention':'Automatic sync is on';desc=syncBlocked?'This device and the cloud may contain different changes. Sync has paused to protect your contacts.':'Your contacts update automatically on signed-in devices.';cta=syncBlocked?'Review Sync Options':''}
 else if(!hasCloud){heading='Ready to protect your contacts';desc=db.contacts.length?'Your '+db.contacts.length+' contacts are on this device. Create your first cloud backup to enable automatic sync.':'No contacts are on this device or in the cloud. Add contacts first, then enable sync.';cta=db.contacts.length?'Back Up & Enable Sync':'';action='first'}
 else if(same){heading='Ready to sync';desc='Your device matches the '+cloudCount+' contacts saved in the cloud.';cta='Enable Automatic Sync';action='enable'}
 else if(db.contacts.length===0){heading='Bring your contacts to this device';desc='We found '+cloudCount+' contacts in your cloud account. Restore them here, then turn on sync.';cta='Restore Contacts & Enable Sync';action='restore'}
 else {heading='Review before syncing';desc='This device has '+db.contacts.length+' contacts and the cloud has '+cloudCount+'. They differ, so syncing is paused to prevent accidental data loss. Export a backup before choosing a copy. No automatic merge will occur.';cta='Review Safe Options';action='review'}
 area.innerHTML=`<div class="cloud-card"><div class="cloud-status-icon">${active&&!syncBlocked?'✓':'☁'}</div><h2>${heading}</h2><p class="hint">${desc}</p><div class="cloud-stats"><div><span>On this device</span><strong>${db.contacts.length}</strong></div><div><span>In cloud</span><strong>${hasCloud?cloudCount:'—'}</strong></div></div>${active?`<p class="cloud-state" id="sync-status">${syncBlocked?'Needs attention':navigator.onLine?'Up to date':'Offline — changes saved locally'}</p><p class="hint" id="last-sync"></p>`:''}${cta?`<button class="action full cloud-primary" id="cloud-next">${cta}</button>`:''}</div><details class="cloud-details" id="cloud-tools"><summary>Backup & Recovery Options</summary><div id="cloud-advanced"></div></details><p class="hint cloud-account">Signed in as ${esc(user.email||'Account')}</p>`;
 cloudAdvanced(client,hasCloud);
 $('#cloud-disable')?.addEventListener('click',()=>{if(confirm('Turn off automatic sync on this device? Your local contacts will stay saved.')){syncStop();cloudRefresh()}});
 $('#cloud-next')?.addEventListener('click',async()=>{if(action==='enable')await syncEnable();else if(action==='first')await cloudFirstSetup();else if(action==='restore')await cloudRestoreAndSync();else{let d=$('#cloud-tools');d.open=true;d.scrollIntoView({block:'nearest',behavior:'smooth'});cloudMessage('Export a local backup, then choose which copy to keep. Manual restore replaces device contacts; manual backup replaces cloud contacts. No changes have been made.')}});
 if(active&&!syncBlocked){let t=localStorage.getItem(LAST_SYNC_KEY);$('#last-sync').textContent=t?'Last successful sync: '+new Date(t).toLocaleString():'Checking for changes…';syncTick()}
 }catch(e){cloudMessage(e.message||'Unable to connect to Supabase',true);if(area)area.innerHTML='<p class="hint">Cloud connection unavailable. Your local contacts are unchanged.</p><button class="cloud-outline" id="cloud-retry">Retry</button>';$('#cloud-retry')?.addEventListener('click',cloudRefresh)}}
async function cloudAuth(mode){if(cloudBusy)return;let email=$('#cloud-email')?.value.trim(),password=$('#cloud-password')?.value;if(!email){cloudMessage('Enter your email address.',true);return}if(mode!=='reset'&&(!password||password.length<6)){cloudMessage('Enter a password with at least 6 characters.',true);return}if(mode==='create'&&password!==$('#cloud-confirm')?.value){cloudMessage('Passwords do not match.',true);return}
 cloudBusy=true;let submit=$('#cloud-auth-submit');if(submit)submit.disabled=true;
 try{let client=cloudApi();if(mode==='reset'){let {error}=await client.auth.resetPasswordForEmail(email);if(error)throw error;cloudMessage('If this email has an account, a password reset link will arrive shortly.');return}
 let {data,error}=mode==='create'?await client.auth.signUp({email,password}):await client.auth.signInWithPassword({email,password});if(error)throw error;
 if(mode==='create'&&!data.session){cloudAuthScreen('verify');cloudMessage('Check your inbox to confirm your account.');return}
 if(localStorage.getItem(LOCK_KEY)==='yes'){await unlockFromCloud();return}cloudMessage('Signed in.');await cloudRefresh();await autoSetupSync()
 }catch(e){cloudMessage(e.message||'Unable to continue',true)}finally{cloudBusy=false;if($('#cloud-auth-submit'))$('#cloud-auth-submit').disabled=false}}

async function unlockFromCloud(){
 const client=cloudApi(),{data:{user}}=await client.auth.getUser();if(!user)throw Error('Sign in required');
 const {data:row,error}=await client.from('contact_backups').select('backup_data').eq('user_id',user.id).maybeSingle();if(error)throw error;
 if(!row||!Array.isArray(row.backup_data?.contacts))throw Error('No cloud contacts found. Please contact support; this device remains locked.');
 const incoming=row.backup_data;await replaceContacts(incoming);localStorage.removeItem(LOCK_KEY);applyTheme();view='contacts';render();await syncEnable();flash('Signed in — contacts restored');
}
async function autoSetupSync(){
 try{if(syncEnabled())return;const client=cloudApi(),{data:{user}}=await client.auth.getUser();if(!user)return;
 const {data:row,error}=await client.from('contact_backups').select('backup_data').eq('user_id',user.id).maybeSingle();if(error)return;
 if(!row){if(db.contacts.length)await cloudFirstSetup();else{const {error:e}=await client.from('contact_backups').upsert({user_id:user.id,backup_data:db,updated_at:new Date().toISOString()});if(!e)await syncEnable()}}
 else if(stableCloudJSON(row.backup_data)===stableCloudJSON(db))await syncEnable();
 else if(db.contacts.length===0&&Array.isArray(row.backup_data?.contacts)){await replaceContacts(row.backup_data);await syncEnable();if(view!=='cloud')render()}
 else cloudMessage('This device has different contacts. Review safe sync options before continuing.',true);
 }catch(e){cloudMessage('Sync setup needs attention: '+e.message,true)}
}
async function cloudFirstSetup(){if(!db.contacts.length)return;let client=cloudApi();let {data:{user}}=await client.auth.getUser();if(!user)return cloudMessage('Sign in first.',true);let {data:existing,error}=await client.from('contact_backups').select('backup_data').eq('user_id',user.id).maybeSingle();if(error)return cloudMessage(error.message,true);if(existing)return cloudRefresh();await cloudUpload();let {data:check}=await client.from('contact_backups').select('backup_data').eq('user_id',user.id).maybeSingle();if(check&&stableCloudJSON(check.backup_data)===stableCloudJSON(db))await syncEnable()}
async function cloudRestoreAndSync(){if(!confirm('Restore cloud contacts to this device and enable automatic sync? A copy of your current local data will be saved before restoring.'))return;await cloudRestore(true);let client=cloudApi(),{data:{user}}=await client.auth.getUser();if(!user)return;let {data}=await client.from('contact_backups').select('backup_data').eq('user_id',user.id).maybeSingle();if(data&&stableCloudJSON(data.backup_data)===stableCloudJSON(db))await syncEnable()}
async function cloudUpload(){if(cloudBusy)return;if(syncEnabled()){cloudMessage('Turn off automatic sync before using manual backup.',true);return}if(!confirm('Back up '+db.contacts.length+' contacts to the cloud? This replaces any existing cloud backup.'))return;cloudBusy=true;try{let client=cloudApi(),{data:{user},error:authError}=await client.auth.getUser();if(authError||!user)throw authError||Error('Please sign in');let snapshot=JSON.parse(JSON.stringify(db));let {error}=await client.from('contact_backups').upsert({user_id:user.id,backup_data:snapshot,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;let {data:verify,error:verifyError}=await client.from('contact_backups').select('backup_data,updated_at').eq('user_id',user.id).single();if(verifyError||!verify||stableCloudJSON(verify.backup_data)!==stableCloudJSON(snapshot))throw Error('Upload could not be verified. Please try again.');cloudMessage('Backup verified: '+snapshot.contacts.length+' contacts saved to cloud.');await cloudRefresh();cloudMessage('Backup verified: '+snapshot.contacts.length+' contacts saved to cloud.')}catch(e){cloudMessage('Backup not verified: '+e.message,true)}finally{cloudBusy=false}}
async function cloudRestore(skipConfirm=false){if(cloudBusy)return;if(syncEnabled()){cloudMessage('Turn off automatic sync before manually restoring.',true);return}cloudBusy=true;try{let client=cloudApi(),{data:{user},error:authError}=await client.auth.getUser();if(authError||!user)throw authError||Error('Please sign in');let {data,error}=await client.from('contact_backups').select('backup_data').eq('user_id',user.id).single();if(error)throw error;let incoming=data?.backup_data;if(!incoming||!Array.isArray(incoming.contacts))throw Error('Cloud backup has no valid contacts array');if(!skipConfirm&&!confirm('Restore '+incoming.contacts.length+' cloud contacts? This REPLACES '+db.contacts.length+' contacts currently on this device. Export a JSON backup first.'))return;await replaceContacts(incoming);applyTheme();cloudPage();cloudMessage('Restored '+db.contacts.length+' contacts.');}catch(e){cloudMessage('Restore failed: '+e.message,true)}finally{cloudBusy=false}}

function applyTheme(){let light=db.theme==='light';document.documentElement.setAttribute('data-theme',light?'light':'dark');document.querySelector('meta[name="theme-color"]')?.setAttribute('content',light?'#f3f6fb':'#0b1428');document.querySelector('meta[name="color-scheme"]')?.setAttribute('content',light?'light':'dark');document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')?.setAttribute('content',light?'default':'black')}
function render(){if(localStorage.getItem(LOCK_KEY)==='yes'){lockPage();return}if(['contacts','favorites','search'].includes(view))listPage();else if(view==='add')addPage();else if(view==='detail')detailPage();else if(view==='tags')tagsPage();else if(view==='settings')settingsPage();else if(view==='sort')sortPage();else if(view==='mycard')myCardPage();else if(view==='share')sharePage();else if(view==='cloud')cloudPage();else if(view==='transfer')transferPage();else if(view==='account')accountPage();else if(view==='home')homePage();else if(view==='stay')stayPage();else if(view==='cleanup')cleanupPage()};(async()=>{try{await initializeStorage();applyTheme();render();if(syncEnabled())setTimeout(syncTick,2200);else if(localStorage.getItem(LOCK_KEY)!=='yes')setTimeout(autoSetupSync,2600)}catch(e){storageFailure=e;document.querySelector('#app').innerHTML='<main class="main" style="padding:28px"><h2>Unable to open contact storage</h2><p>Your contacts have not been deleted. Please do not clear browser data or uninstall the app.</p><p>Try reopening the app. If this continues, contact support.</p></main>';console.error(e)}})();
</script></body></html>
