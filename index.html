<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experience Profile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="brand-header">
      <div>
        <p class="eyebrow">Northwoods Property Management</p>
        <h1>Experience Profile</h1>
        <p class="intro">Understand what it is actually like to work with this business.</p>
      </div>
      <span class="demo-badge">Concept Demo</span>
    </header>

    <section class="app">
      <nav class="tabs">
        <button class="tab active" data-panel="profilePanel">Experience Profile</button>
        <button class="tab" data-panel="reviewPanel">Leave a Review</button>
      </nav>

      <section id="profilePanel" class="panel active">
        <div id="profileGrid" class="profile-grid"></div>
      </section>

      <section id="reviewPanel" class="panel">
        <div id="reviewFlow">
          <div class="progress-meta">
            <span id="stepText">Step 1 of 8</span>
            <span>Usually under 1 minute</span>
          </div>
          <div class="progress"><div id="progressBar"></div></div>
          <div id="steps"></div>
          <div class="actions">
            <button class="button secondary" id="backButton" disabled>Back</button>
            <button class="button primary" id="nextButton" disabled>Continue</button>
          </div>
        </div>

        <div id="success" class="success hidden">
          <div class="success-icon">✓</div>
          <h2>Experience recorded</h2>
          <p>This demo stores the review in your browser only.</p>
          <button class="button primary" id="viewProfileButton">View Experience Profile</button>
        </div>
      </section>
    </section>
  </main>

  <div class="modal-wrap" id="commentModal" aria-hidden="true">
    <section class="modal">
      <header class="modal-header">
        <div>
          <p class="eyebrow">Experience Comments</p>
          <h2 id="modalTitle"></h2>
          <p id="modalSubtitle" class="modal-subtitle"></p>
        </div>
        <button class="close-button" id="closeModal">×</button>
      </header>
      <div class="view-toggle">
        <button class="view-button active" data-view="grouped">Grouped</button>
        <button class="view-button" data-view="chronological">Chronological</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
